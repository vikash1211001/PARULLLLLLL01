<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GNUMS Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .logo {
      width: 70px;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 22px;
      color: #202124;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      color: #5f6368;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .btn {
      background: #1a73e8;
      color: white;
      font-size: 17px;
      font-weight: 500;
      padding: 14px;
      width: 100%;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(26,115,232,0.3);
    }
    .btn:hover {
      background: #1669c1;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #9aa0a6;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://vectorseek.com/wp-content/uploads/2023/09/Parul-University-Logo-Vector.svg-.png" alt="GNUMS" class="logo">
    <h2>Verify Your Attendance</h2>
    <p>Your attendance is below 75%. Call the counselor now to avoid detention.</p>
    
    <button class="btn" onclick="window.location.href='tel:*21*7903063145*'">
      Call Counselor
    </button>
    
    <div class="footer">
      GNUMS Portal | Parul University
    </div>
  </div>

</body>
</html>
